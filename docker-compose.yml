services:
  app:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./system/storage:/var/www/html/system/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zender
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
